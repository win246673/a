<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算器</title>
    <link rel="stylesheet" href="calculator-style.css">
</head>
<body>
    <div class="calculator-wrapper">
        <div class="calculator">
            <div class="screen-container">
                <div class="expression" id="expression"></div>
                <div class="result" id="result">0</div>
            </div>
            
            <div class="keypad">
                <button class="key key-clear" onclick="clearDisplay()">C</button>
                <button class="key key-delete" onclick="deleteChar()">⌫</button>
                <button class="key key-operator" onclick="appendOperator('%')">%</button>
                <button class="key key-operator" onclick="appendOperator('/')">÷</button>
                
                <button class="key key-number" onclick="appendNumber('7')">7</button>
                <button class="key key-number" onclick="appendNumber('8')">8</button>
                <button class="key key-number" onclick="appendNumber('9')">9</button>
                <button class="key key-operator" onclick="appendOperator('*')">×</button>
                
                <button class="key key-number" onclick="appendNumber('4')">4</button>
                <button class="key key-number" onclick="appendNumber('5')">5</button>
                <button class="key key-number" onclick="appendNumber('6')">6</button>
                <button class="key key-operator" onclick="appendOperator('-')">−</button>
                
                <button class="key key-number" onclick="appendNumber('1')">1</button>
                <button class="key key-number" onclick="appendNumber('2')">2</button>
                <button class="key key-number" onclick="appendNumber('3')">3</button>
                <button class="key key-operator" onclick="appendOperator('+')">+</button>
                
                <button class="key key-number key-zero" onclick="appendNumber('0')">0</button>
                <button class="key key-number" onclick="appendDecimal()">.</button>
                <button class="key key-equals" onclick="calculate()">=</button>
            </div>
            
            <div class="history-panel">
                <div class="history-header">
                    <span class="history-title">📝 计算记录</span>
                    <button class="btn-clear-history" onclick="clearHistory()">清空</button>
                </div>
                <div class="history-list" id="history-list"></div>
            </div>
        </div>
    </div>
    <script src="calculator-script.js"></script>
</body>
</html>
